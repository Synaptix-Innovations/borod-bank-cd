apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  # Автоматическое подключение Prometheus как datasource
  datasource.yml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-service.monitoring:9090
      access: proxy
      isDefault: true
      editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  # Провайдер для автозагрузки дашбордов из ConfigMap
  dashboards.yml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: 'Borod Bank'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-springboot
  namespace: monitoring
data:
  # Spring Boot JVM Dashboard (упрощённая версия официального 4701)
  spring-boot.json: |
    {
      "title": "Borod Bank - Spring Boot JVM",
      "uid": "borod-bank-jvm",
      "tags": ["spring-boot", "borod-bank"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Requests Rate",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "expr": "rate(http_server_requests_seconds_count{application=\"borod-bank\"}[1m])",
            "legendFormat": "{{method}} {{uri}} {{status}}"
          }]
        },
        {
          "id": 2,
          "title": "HTTP Response Time (p99)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{application=\"borod-bank\"}[1m]))",
            "legendFormat": "p99 {{uri}}"
          }]
        },
        {
          "id": 3,
          "title": "JVM Heap Memory Used",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [{
            "expr": "jvm_memory_used_bytes{application=\"borod-bank\", area=\"heap\"}",
            "legendFormat": "{{id}}"
          }]
        },
        {
          "id": 4,
          "title": "JVM CPU Usage",
          "type": "gauge",
          "gridPos": {"x": 12, "y": 8, "w": 6, "h": 8},
          "targets": [{
            "expr": "process_cpu_usage{application=\"borod-bank\"}",
            "legendFormat": "CPU"
          }],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1}}
        },
        {
          "id": 5,
          "title": "Active DB Connections",
          "type": "stat",
          "gridPos": {"x": 18, "y": 8, "w": 6, "h": 8},
          "targets": [{
            "expr": "hikaricp_connections_active{application=\"borod-bank\"}",
            "legendFormat": "Active"
          }]
        },
        {
          "id": 6,
          "title": "HTTP Error Rate (5xx)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 16, "w": 24, "h": 8},
          "targets": [{
            "expr": "rate(http_server_requests_seconds_count{application=\"borod-bank\", status=~\"5..\"}[1m])",
            "legendFormat": "5xx errors {{uri}}"
          }]
        }
      ]
    }
