apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472    # grafana official UID
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:10.4.0
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: grafana-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboard-springboot
          mountPath: /var/lib/grafana/dashboards/springboot
          readOnly: true
        - name: dashboard-nightly
          mountPath: /var/lib/grafana/dashboards/nightly
          readOnly: true
        - name: dashboard-app-overview
          mountPath: /var/lib/grafana/dashboards/app-overview
          readOnly: true
        - name: dashboard-infra
          mountPath: /var/lib/grafana/dashboards/infra
          readOnly: true
        - name: dashboard-aiops
          mountPath: /var/lib/grafana/dashboards/aiops
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: grafana-data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: datasources
        configMap:
          name: grafana-datasources
          items:
          - key: datasource.yml
            path: datasource.yml
      - name: dashboards-provider
        configMap:
          name: grafana-dashboards-provider
          items:
          - key: dashboards.yml
            path: dashboards.yml
      - name: dashboard-springboot
        configMap:
          name: grafana-dashboard-springboot
          items:
          - key: spring-boot.json
            path: spring-boot.json
      - name: dashboard-nightly
        configMap:
          name: grafana-dashboard-nightly
          items:
          - key: nightly-pipeline.json
            path: nightly-pipeline.json
      - name: dashboard-app-overview
        configMap:
          name: grafana-dashboard-app-overview
          items:
          - key: app-overview.json
            path: app-overview.json
      - name: dashboard-infra
        configMap:
          name: grafana-dashboard-infra
          items:
          - key: infra.json
            path: infra.json
      - name: dashboard-aiops
        configMap:
          name: grafana-dashboard-aiops
          items:
          - key: aiops.json
            path: aiops.json
