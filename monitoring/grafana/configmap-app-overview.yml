apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app-overview
  namespace: monitoring
data:
  app-overview.json: |
    {
      "title": "Borod Bank - Application Overview",
      "uid": "borod-app-overview",
      "tags": ["spring-boot", "borod-bank", "application"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{application=\"borod-bank\"}[1m])) by (method, uri, status)",
            "legendFormat": "{{method}} {{uri}} [{{status}}]"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "title": "HTTP Response Time",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"borod-bank\"}[1m])) by (le, uri))",
              "legendFormat": "p95 {{uri}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{application=\"borod-bank\"}[1m])) by (le, uri))",
              "legendFormat": "p99 {{uri}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 3,
          "title": "HTTP Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"borod-bank\", status=~\"4..\"}[1m]))",
              "legendFormat": "4xx errors"
            },
            {
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"borod-bank\", status=~\"5..\"}[1m]))",
              "legendFormat": "5xx errors"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 4,
          "title": "JVM Heap Memory",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{application=\"borod-bank\", area=\"heap\"}",
              "legendFormat": "Used {{id}}"
            },
            {
              "expr": "jvm_memory_max_bytes{application=\"borod-bank\", area=\"heap\"}",
              "legendFormat": "Max {{id}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 5,
          "title": "GC Pause Duration",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 8, "h": 8 },
          "targets": [{
            "expr": "rate(jvm_gc_pause_seconds_sum{application=\"borod-bank\"}[1m])",
            "legendFormat": "{{action}} {{cause}}"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 6,
          "title": "Active Threads",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 16, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "jvm_threads_live_threads{application=\"borod-bank\"}",
              "legendFormat": "Live"
            },
            {
              "expr": "jvm_threads_daemon_threads{application=\"borod-bank\"}",
              "legendFormat": "Daemon"
            },
            {
              "expr": "jvm_threads_peak_threads{application=\"borod-bank\"}",
              "legendFormat": "Peak"
            }
          ]
        },
        {
          "id": 7,
          "title": "CPU Usage",
          "type": "gauge",
          "gridPos": { "x": 16, "y": 16, "w": 4, "h": 8 },
          "targets": [{
            "expr": "process_cpu_usage{application=\"borod-bank\"}",
            "legendFormat": "CPU"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.6 },
                  { "color": "red", "value": 0.85 }
                ]
              }
            }
          }
        },
        {
          "id": 8,
          "title": "Open File Descriptors",
          "type": "stat",
          "gridPos": { "x": 20, "y": 16, "w": 4, "h": 8 },
          "targets": [
            {
              "expr": "process_files_open_files{application=\"borod-bank\"}",
              "legendFormat": "Open"
            },
            {
              "expr": "process_files_max_files{application=\"borod-bank\"}",
              "legendFormat": "Max"
            }
          ]
        }
      ]
    }
