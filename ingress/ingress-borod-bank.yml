apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: borod-bank-ingress
  namespace: borod-bank
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.vladinnovations.info
      secretName: borod-bank-tls
  rules:
    - host: app.vladinnovations.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: borod-bank-service
                port:
                  number: 80
