apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-secret
  namespace: borod-bank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_USER
      remoteRef:
        key: borod-bank/mysql
        property: MYSQL_ROOT_USER

    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: borod-bank/mysql
        property: MYSQL_ROOT_PASSWORD

    # Full JDBC URL stored in Secrets Manager so RDS endpoint is not hardcoded in git
    # Value: jdbc:mysql://<RDS_ENDPOINT>:3306/borodbankdb?useSSL=true&serverTimezone=UTC
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: borod-bank/mysql
        property: SPRING_DATASOURCE_URL
