apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: borod-bank-hpa
  namespace: borod-bank
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: borod-bank
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5min before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60  # Scale down max 50% per minute
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30  # Scale up max 100% per 30s
      - type: Pods
        value: 2
        periodSeconds: 30  # Or add max 2 pods per 30s
      selectPolicy: Max  # Use the policy that scales up faster
