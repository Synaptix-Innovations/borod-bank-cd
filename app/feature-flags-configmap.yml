apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
  namespace: borod-bank
data:
  # Toggle transfer form in dashboard UI and block /transfer endpoint server-side.
  # Set to "false" to disable without redeploying the image.
  FEATURES_TRANSFER_ENABLED: "true"
  # Show maintenance banner at the top of the dashboard.
  FEATURES_MAINTENANCE_MODE: "false"
