apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: borod-bank-netpol
  namespace: borod-bank
spec:
  podSelector:
    matchLabels:
      app: borod-bank
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow HTTP traffic on port 8080 from anywhere in the cluster
    # Will be restricted to ingress-nginx namespace in Step 7
    - ports:
      - port: 8080

  egress:
    # Allow DNS resolution
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP

    # Allow connection to RDS in private VPC subnets (10.0.10-11.0/24)
    - to:
      - ipBlock:
          cidr: 10.0.0.0/16
      ports:
      - port: 3306
