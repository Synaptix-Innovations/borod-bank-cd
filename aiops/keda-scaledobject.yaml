apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ollama-serve
  namespace: aiops
spec:
  scaleTargetRef:
    name: ollama-serve
  minReplicaCount: 0
  maxReplicaCount: 1
  # 10 min idle → scale to 0 → CA removes GPU node
  cooldownPeriod: 600
  pollingInterval: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
        metricName: aiops_gateway_pending_requests
        threshold: "1"
        query: aiops_gateway_pending_requests
