apiVersion: v1
kind: LimitRange
metadata:
  name: aiops-limits
  namespace: aiops
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 6Gi
      min:
        cpu: 10m
        memory: 64Mi
