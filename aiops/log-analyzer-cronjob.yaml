apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-log-analyzer
  namespace: aiops
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: scripts
              configMap:
                name: aiops-analyzer-script
          containers:
            - name: analyzer
              image: python:3.12-slim
              command:
                - sh
                - -c
                - pip install requests anthropic --quiet && python3 /scripts/aiops_analyzer.py
              env:
                - name: LOKI_URL
                  value: http://loki.loki.svc.cluster.local:3100
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aiops-anthropic-secret
                      key: ANTHROPIC_API_KEY
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: aiops-slack-secret
                      key: SLACK_WEBHOOK_URL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
