# Ollama Serve — qwen2.5-coder:7b on GPU spot node (g4dn.xlarge, T4 16GB)
# KEDA ScaledObject manages replicas: 0 when idle, 1 when gateway has pending requests
# Cluster Autoscaler provisions/deprovisions GPU node accordingly
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-serve
  namespace: aiops
spec:
  replicas: 0  # KEDA owns this value
  selector:
    matchLabels:
      app: ollama-serve
  template:
    metadata:
      labels:
        app: ollama-serve
    spec:
      nodeSelector:
        aiops: "true"
      tolerations:
        - key: aiops
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      initContainers:
        # Pull model into PVC cache — skips download on subsequent starts
        - name: model-pull
          image: ollama/ollama:0.5
          command:
            - sh
            - -c
            - |
              ollama serve &
              SERVER_PID=$!
              echo "Waiting for ollama server..."
              for i in $(seq 1 30); do
                curl -sf http://localhost:11434/api/tags > /dev/null 2>&1 && break
                sleep 2
              done
              ollama pull qwen2.5-coder:7b
              kill $SERVER_PID
          env:
            - name: OLLAMA_MODELS
              value: /models
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
      containers:
        - name: ollama
          image: ollama/ollama:0.5
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 14Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ollama-7b-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-serve
  namespace: aiops
spec:
  selector:
    app: ollama-serve
  ports:
    - port: 11434
      targetPort: 11434
