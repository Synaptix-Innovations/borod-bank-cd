apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aiops-anthropic
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aiops-anthropic-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: borod-bank/aiops
        property: ANTHROPIC_API_KEY
