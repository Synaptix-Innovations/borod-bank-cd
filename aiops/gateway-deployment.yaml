apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-gateway-script
  namespace: aiops
data:
  gateway.py: |
    """AIOps Gateway — receives code review requests from Jenkins,
    calls Claude API (Haiku) for analysis, exposes Prometheus metric."""

    import os
    import anthropic
    from fastapi import FastAPI, HTTPException, Request
    from fastapi.responses import JSONResponse
    from prometheus_client import Gauge, make_asgi_app

    ANTHROPIC_API_KEY = os.environ["ANTHROPIC_API_KEY"]
    MODEL = os.environ.get("CLAUDE_MODEL", "claude-haiku-4-5-20251001")
    MAX_TOKENS = int(os.environ.get("MAX_TOKENS", "300"))

    app = FastAPI(title="AIOps Gateway")

    pending = Gauge(
        "aiops_gateway_pending_requests",
        "Pending AI code review requests",
    )

    metrics_app = make_asgi_app()
    app.mount("/metrics", metrics_app)

    client = anthropic.Anthropic(api_key=ANTHROPIC_API_KEY)


    @app.post("/review")
    async def code_review(request: Request):
        body = await request.json()
        diff = body.get("diff", "").strip()
        context = body.get("context", "")

        if not diff:
            raise HTTPException(status_code=400, detail="diff is required")

        pending.inc()
        try:
            prompt = (
                f"CONTEXT: {context}\n\nDIFF:\n{diff}"
            )

            message = client.messages.create(
                model=MODEL,
                max_tokens=MAX_TOKENS,
                messages=[{"role": "user", "content": prompt}],
                system=(
                    "You are a senior DevOps and Java engineer. Review this code change.\n"
                    "Provide: 1) Security issues (if any) 2) Code quality issues "
                    "3) Top 2 actionable improvements.\n"
                    "Be concise. Maximum 10 lines. Plain text."
                ),
                temperature=0.1,
            )

            review_text = message.content[0].text
            return JSONResponse({"review": review_text})
        finally:
            pending.dec()


    @app.get("/health")
    async def health():
        return {"status": "ok"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-gateway
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-gateway
  template:
    metadata:
      labels:
        app: aiops-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install fastapi uvicorn anthropic prometheus-client --quiet
              python -m uvicorn gateway:app --host 0.0.0.0 --port 8080
          workingDir: /app
          env:
            - name: HOME
              value: /tmp
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-anthropic-secret
                  key: ANTHROPIC_API_KEY
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: scripts
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: scripts
          configMap:
            name: aiops-gateway-script
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-gateway
  namespace: aiops
spec:
  selector:
    app: aiops-gateway
  ports:
    - port: 8080
      targetPort: 8080
