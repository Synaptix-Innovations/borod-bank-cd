apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-7b-model-cache
  namespace: aiops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2-csi
  # WaitForFirstConsumer ensures volume is created in the same AZ as the GPU node
  resources:
    requests:
      storage: 30Gi
