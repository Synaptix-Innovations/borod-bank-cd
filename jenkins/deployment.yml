apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/jenkins_home"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
        - name: wait-for-secrets
          image: alpine/k8s:1.31.2
          command:
            - sh
            - -c
            - |
              echo "Waiting for jenkins-secrets to be synced by ESO..."
              until kubectl get secret jenkins-secrets -n jenkins > /dev/null 2>&1; do
                echo "Secret not ready, retrying in 5s..."
                sleep 5
              done
              echo "jenkins-secrets is ready."
      containers:
        - name: jenkins
          image: vlad7774/jenkins-borod-bank:latest
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 50000
              name: agent
          envFrom:
            - secretRef:
                name: jenkins-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-pvc
