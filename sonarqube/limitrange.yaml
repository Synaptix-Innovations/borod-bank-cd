apiVersion: v1
kind: LimitRange
metadata:
  name: sonarqube-limits
  namespace: sonarqube
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 200m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 64Mi
