apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.10.1"
    helm:
      values: |
        controller:
          service:
            annotations:
              # AWS Load Balancer Controller — provisions NLB (not Classic ELB)
              service.beta.kubernetes.io/aws-load-balancer-type: "external"
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
              # Static EIPs — one per AZ. Filled by post-deploy.sh after terraform apply.
              # DNS A-records point to these IPs once and never change between deploys.
              service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-0f647d68babbf6270,eipalloc-04307aefc3a73aec7,eipalloc-04139a1a436b62e03"
              # Cross-zone LB: route traffic from any AZ EIP to any healthy target pod
              service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
          replicaCount: 2
          # Required for ArgoCD ssl-passthrough ingress
          extraArgs:
            enable-ssl-passthrough: ""
          metrics:
            enabled: true
          config:
            use-forwarded-headers: "true"
            compute-full-forwarded-for: "true"
            use-proxy-protocol: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
