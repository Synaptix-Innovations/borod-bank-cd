apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: borod-bank
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Synaptix-Innovations/borod-bank-cd.git
    targetRevision: main
    path: app
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: borod-bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: "external-secrets.io"
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /spec/target/deletionPolicy
