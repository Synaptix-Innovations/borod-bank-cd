apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: "1.8.1"
    helm:
      values: |
        clusterName: borod-bank-cluster
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            # Get value from: terraform output lbc_role_arn
            eks.amazonaws.com/role-arn: CHANGE_ME_LBC_ROLE_ARN
        region: us-east-1
        vpcId: CHANGE_ME_VPC_ID
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
