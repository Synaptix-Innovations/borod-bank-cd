apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: borod-bank
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vlad774/borod-bank-cd.git
    targetRevision: main
    path: .
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: borod-bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
