apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-secrets
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jenkins-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DOCKER_HUB_USER
      remoteRef:
        key: borod-bank/jenkins
        property: DOCKER_HUB_USER

    - secretKey: DOCKER_HUB_PAT
      remoteRef:
        key: borod-bank/jenkins
        property: DOCKER_HUB_PAT

    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: borod-bank/jenkins
        property: GITHUB_TOKEN

    - secretKey: SONARQUBE_TOKEN
      remoteRef:
        key: borod-bank/jenkins
        property: SONARQUBE_TOKEN

    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: borod-bank/jenkins
        property: SLACK_WEBHOOK_URL

    - secretKey: DOCKER_HUB_PASSWORD
      remoteRef:
        key: borod-bank/jenkins
        property: DOCKER_HUB_PASSWORD

    - secretKey: GITHUB_USER
      remoteRef:
        key: borod-bank/jenkins
        property: GITHUB_USER

    - secretKey: SONAR_TOKEN
      remoteRef:
        key: borod-bank/jenkins
        property: SONAR_TOKEN

    - secretKey: JENKINS_ADMIN_PASSWORD
      remoteRef:
        key: borod-bank/jenkins
        property: JENKINS_ADMIN_PASSWORD
